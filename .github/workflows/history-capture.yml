name: uCode History Capture (real UI)

# Pilot captures actual historical browser UI. No release mutation,
# no PDFs, no screenshots generated by AI, no deployment to the public site.
on:
  pull_request:
    paths:
      - 'scripts/history_capture.py'
      - '.github/workflows/history-capture.yml'
      - 'docs/HISTORY_CAPTURE.md'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing stable release tag (pilot: v0.3.4)'
        required: true
        default: 'v0.3.4'
        type: string
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: history-capture-${ github.event_name }}-${ github.ref }}
  cancel-in-progress: false

jobs:
  capture-browser:
    if: github.event_name != 'release' || github.event.release.prerelease == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_TAG: ${ github.event_name == 'release' && github.event.release.tag_name || github.event_name == 'workflow_dispatch' && inputs.tag || 'v0.3.4' }}
    steps:
      - name: Checkout capture tooling
        uses: actions/checkout@v4
        with:
          path: capture-tools
          persist-credentials: false
      - name: Checkout historical release sources (never moving main)
        uses: actions/checkout@v4
        with:
          ref: ${ env.SOURCE_TAG }}
          path: history-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install historical uCode and Playwright in ephemeral runner
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ./history-source 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Capture actual UI tabs (read-only)
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Only stable semantic-version release tags are accepted."
            exit 1
          fi
          SOURCE_SHA="$(git -C history-source rev-parse HEAD)"
          python capture-tools/scripts/history_capture.py \
            --source-root history-source \
            --output "capture-output/$SOURCE_TAG" \
            --expected-version "${SOURCE_TAG#v}" \
            --source-ref "$SOURCE_TAG" \
            --source-commit "$SOURCE_SHA"
      - name: Upload screenshot pilot and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ucode-history-capture-${ github.run_id }}
          path: capture-output/
          if-no-files-found: warn
          retention-days: 30
