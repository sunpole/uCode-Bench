name: uCode History Capture (real UI)

# Pilot captures actual historical browser UI. No release mutation,
# no PDFs, no screenshots generated by AI, no deployment to the public site.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/history-capture.yml'
  pull_request:
    paths:
      - 'scripts/history_capture.py'
      - '.github/workflows/history-capture.yml'
      - 'docs/HISTORY_CAPTURE.md'
      - 'ucode/operator_web.py'
      - 'ucode/assets/operator-updates.js'
      - 'ucode/assets/operator-updates.css'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing stable release tag (pilot: v0.3.4)'
        required: true
        default: 'v0.3.4'
        type: string
      publish_history:
        description: 'Save captured PNG permanently in history-gallery branch'
        required: false
        default: false
        type: boolean
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: history-capture-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  capture-browser:
    if: github.event_name != 'release' || github.event.release.prerelease == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event_name == 'workflow_dispatch' && inputs.tag || 'v0.3.4' }}
    steps:
      - name: Checkout capture tooling
        uses: actions/checkout@v4
        with:
          path: capture-tools
          persist-credentials: false
      - name: Checkout historical release sources (never moving main)
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_TAG }}
          path: history-source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install historical uCode and Playwright in ephemeral runner
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -e ./history-source 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Capture actual UI tabs (read-only)
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$SOURCE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Only stable semantic-version release tags are accepted."
            exit 1
          fi
          SOURCE_SHA="$(git -C history-source rev-parse HEAD)"
          python capture-tools/scripts/history_capture.py \
            --source-root history-source \
            --output "capture-output/$SOURCE_TAG" \
            --expected-version "${SOURCE_TAG#v}" \
            --source-ref "$SOURCE_TAG" \
            --source-commit "$SOURCE_SHA"
      - name: Upload screenshot pilot and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ucode-history-capture-${{ github.run_id }}
          path: capture-output/
          if-no-files-found: warn
          retention-days: 30

  capture-development:
    if: github.event_name == 'pull_request' || github.event_name == 'push' || (github.event_name == 'release' && github.event.release.prerelease == true)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install isolated preview UI and browser
        run: |
          python -m pip install -e . 'playwright==1.56.0'
          python -m playwright install --with-deps chromium
      - name: Capture current development tabs, including update center
        shell: bash
        run: |
          set -euo pipefail
          version="$(python -c 'import ucode; print(ucode.__version__)')"
          python scripts/history_capture.py \
            --source-root . \
            --output "dev-capture/${{ github.sha }}" \
            --expected-version "$version" \
            --source-ref development \
            --source-commit "$(git rev-parse HEAD)"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ucode-development-ui-${{ github.run_id }}
          path: dev-capture/
          if-no-files-found: warn
          retention-days: 30

  publish-history:
    needs: capture-browser
    if: >-
      (github.event_name == 'release' && github.event.release.prerelease == false)
      || github.event_name == 'push'
      || (github.event_name == 'workflow_dispatch' && inputs.publish_history == true)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      SOURCE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || github.event_name == 'workflow_dispatch' && inputs.tag || 'v0.3.4' }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: gallery-repo
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          name: ucode-history-capture-${{ github.run_id }}
          path: history-captured
      - name: Verify manifest, PNG integrity and stable source
        shell: python
        run: |
          import hashlib,json,os,pathlib,re,sys
          tag=os.environ['SOURCE_TAG']
          if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+',tag):
              raise SystemExit('Unapproved history tag')
          root=pathlib.Path('history-captured')/tag
          doc=json.loads((root/'manifest.json').read_text(encoding='utf-8'))
          if doc.get('status')!='PASS' or doc.get('source_ref')!=tag or doc.get('version')!=tag[1:]:
              raise SystemExit('Historical screenshot provenance check FAILED')
          images=doc.get('screenshots',[])
          if len(images)<4 or len(images)>32:raise SystemExit('Unexpected screenshot count')
          for record in images:
              name=record.get('file')
              if not isinstance(name,str) or not re.fullmatch(r'[0-9]{2}-tab\.png',name):
                  raise SystemExit('Unsafe PNG name')
              content=(root/name).read_bytes()
              if len(content)!=record['bytes'] or hashlib.sha256(content).hexdigest()!=record['sha256']:
                  raise SystemExit('PNG SHA-256 mismatch: '+name)
          print('VERIFIED_HISTORY:',tag,len(images),'PNG')
      - name: Store immutable captures in dedicated gallery branch
        working-directory: gallery-repo
        shell: bash
        run: |
          set -euo pipefail
          tag="$SOURCE_TAG"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git ls-remote --heads origin refs/heads/history-gallery | grep -q .; then
            git fetch origin refs/heads/history-gallery:refs/remotes/origin/history-gallery
            git switch -c history-gallery --track origin/history-gallery
          else
            git switch --orphan history-gallery
            # --orphan creates an empty index/worktree. No tracked files exist to remove.
          fi
          if test -e "history/$tag"; then
            echo "::notice::Tag already archived; no overwrite."
            exit 0
          fi
          mkdir -p "history/$tag"
          cp -a "../history-captured/$tag/." "history/$tag/"
          git add "history/$tag"
          git commit -m "history: preserve verified UI capture $tag"
          git push origin HEAD:refs/heads/history-gallery

  publish-development-history:
    needs: capture-development
    if: >-
      github.event_name == 'release' &&
      github.event.release.prerelease == true &&
      startsWith(github.event.release.tag_name, 'dev-')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      DEV_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: gallery-repo
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          name: ucode-development-ui-${{ github.run_id }}
          path: captured
      - name: Verify tagged source and all PNG checksums
        shell: python
        run: |
          import hashlib,json,os,pathlib,re
          tag=os.environ['DEV_TAG']
          if not re.fullmatch(r'dev-[a-f0-9]{40}',tag):
              raise SystemExit('Unexpected Development tag')
          commit=tag[4:]
          folder=pathlib.Path('captured')/commit
          doc=json.loads((folder/'manifest.json').read_text(encoding='utf-8'))
          if doc.get('status')!='PASS' or doc.get('channel')!='development' or doc.get('source_commit')!=commit:
              raise SystemExit('Development screenshot provenance mismatch')
          images=doc.get('screenshots',[])
          if not 4<=len(images)<=32:raise SystemExit('Unexpected PNG count')
          for record in images:
              filename=record.get('file')
              if not isinstance(filename,str) or not re.fullmatch(r'[0-9]{2}-tab\.png',filename):
                  raise SystemExit('Unsafe PNG name')
              content=(folder/filename).read_bytes()
              if len(content)!=record['bytes'] or hashlib.sha256(content).hexdigest()!=record['sha256']:
                  raise SystemExit('Development PNG SHA-256 mismatch')
          print('VERIFIED_DEV_HISTORY',tag,len(images))
      - name: Preserve immutable Development screenshots in history-gallery
        working-directory: gallery-repo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin refs/heads/history-gallery:refs/remotes/origin/history-gallery
          git switch -c history-gallery --track origin/history-gallery
          dest="history/development/$DEV_TAG"
          if test -e "$dest"; then
            echo "::notice::This Development screenshot archive already exists."
            exit 0
          fi
          mkdir -p "$dest"
          commit="$(printf '%s' "$DEV_TAG" | sed 's/^dev-//')"
          cp -a "../captured/$commit/." "$dest/"
          git add "$dest"
          git commit -m "history: preserve Development UI $DEV_TAG"
          git push origin HEAD:refs/heads/history-gallery
