name: Independent Windows updater (preview)

on:
  pull_request:
    paths:
      - 'updater/**'
      - 'tests/test_update_center.py'
      - 'tests/test_update_install.py'
      - 'tests/test_development_updates.py'
      - '.github/workflows/publish-development.yml'
      - 'ucode/update_install.py'
      - 'ucode/updater_integration.py'
      - 'ucode/assets/operator-updates.js'
      - 'ucode/assets/operator-updates.css'
      - 'ucode/operator_web.py'
      - '.github/workflows/native-updater-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-updater-preview-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  updater:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Validate Update Center JavaScript syntax
        shell: pwsh
        run: |
          node --check ucode/assets/operator-updates.js
          if ($LASTEXITCODE -ne 0) { throw 'Update Center JavaScript parse failure' }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify GUI update bridge and update center
        shell: pwsh
        run: |
          python -m pip install -e .
          python -m unittest discover -s tests -p "test_update_*.py" -v
          if ($LASTEXITCODE -ne 0) { throw 'Update bridge tests failed' }
          python -m unittest discover -s tests -p "test_development_*.py" -v
          if ($LASTEXITCODE -ne 0) { throw 'Update bridge tests failed' }
      - name: Publish independent self-contained single EXE
        shell: pwsh
        run: |
          dotnet publish updater/uCode.Updater.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -p:DebugType=None -p:DebugSymbols=false -o dist/native-updater
          if ($LASTEXITCODE -ne 0) { throw 'Compile failed' }
      - name: Run native offline self-test
        shell: pwsh
        run: |
          & ./dist/native-updater/uCode.Updater.exe --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Native updater self-test failed' }
          & ./dist/native-updater/uCode.Updater.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'Native updater version failed' }
          & ./dist/native-updater/uCode.Updater.exe --help
          if ($LASTEXITCODE -ne 0) { throw 'Native updater help failed' }
      - name: Publish checksum
        shell: pwsh
        run: |
          $hash=(Get-FileHash -Algorithm SHA256 -LiteralPath dist/native-updater/uCode.Updater.exe).Hash.ToLowerInvariant()
          $content = "$hash  uCode.Updater.exe" + [char]10
          [System.IO.File]::WriteAllText((Join-Path (Get-Location) 'dist/native-updater/SHA256SUMS.txt'), $content, [System.Text.Encoding]::ASCII)
      - uses: actions/upload-artifact@v4
        with:
          name: ucode-native-updater-win64-preview
          path: |
            dist/native-updater/uCode.Updater.exe
            dist/native-updater/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
