name: TXT to PDF smoke (Windows + Linux)

on:
  pull_request:
    paths:
      - "ucode/batch.py"
      - "ucode/batch_gui.py"
      - "ucode/__main__.py"
      - "ucode/gui.py"
      - "ucode/pdf.py"
      - "tests/test_batch.py"
      - "pyproject.toml"
      - ".github/workflows/txt-batch.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-batch:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout feature
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project into runner
        run: python -m pip install -e .
      - name: Compile new Python modules
        run: python -m py_compile ucode/batch.py ucode/batch_gui.py ucode/__main__.py ucode/gui.py
      - name: TXT import / CMYK PDF regression tests
        run: python -m unittest discover -s tests -p test_batch.py -v
