name: TXT to PDF smoke (Windows + Linux)

on:
  pull_request:
    paths:
      - "ucode/**"
      - "tests/**"
      - "scripts/launch.ps1"
      - "scripts/runtime_probe.ps1"
      - "scripts/verify_v02.py"
      - "scripts/verify_smoke.py"
      - "scripts/verify_lab_smoke.py"
      - "scripts/verify_pdf_optimization.py"
      - "ucode/batch.py"
      - "ucode/batch_gui.py"
      - "ucode/__main__.py"
      - "ucode/gui.py"
      - "ucode/pdf.py"
      - "tests/test_batch.py"
      - "tests/test_print_settings.py"
      - "ucode/print_settings.py"
      - "pyproject.toml"
      - "scripts/setup_batch.ps1"
      - "Setup-PDF.cmd"
      - ".github/workflows/txt-batch.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

jobs:
  test-batch:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout feature
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project into runner
        run: python -m pip install -e .
      - name: Rendering and Tk display (Linux)
        if: runner.os == 'Linux'
        run: |
          if ! command -v pdftoppm >/dev/null || ! command -v xvfb-run >/dev/null; then
            sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
            sudo apt-get install -y poppler-utils xvfb
          fi
      - name: PDF renderer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install poppler -y --no-progress
          $exe = Get-ChildItem C:\ProgramData\chocolatey\lib\poppler -Recurse -Filter pdftoppm.exe | Select-Object -First 1
          if (-not $exe) { throw 'pdftoppm not found after install' }
          $exe.Directory.FullName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Compile new Python modules
        run: python -m py_compile ucode/batch.py ucode/batch_gui.py ucode/__main__.py ucode/gui.py
      - name: Parse opt-in PowerShell installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $parseErrors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'scripts/setup_batch.ps1'), [ref]$null, [ref]$parseErrors)
          if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          . (Join-Path $PWD 'scripts/runtime_probe.ps1')
          if ($null -ne (Find-UCodePython -Candidates @('Z:\ucode-missing-python\python.exe'))) { throw 'Missing Python was not rejected' }
      - name: TXT import / CMYK PDF regression tests
        run: python -m unittest discover -s tests -p test_batch.py -v
      - name: Custom sizes, QA and user-readable timings
        run: python -m unittest discover -s tests -p test_print_settings.py -v
      - name: Full regression (Windows)
        if: runner.os == 'Windows'
        run: python -c "import faulthandler,unittest; faulthandler.dump_traceback_later(120, exit=True); suite=unittest.defaultTestLoader.discover('tests'); result=unittest.TextTestRunner(verbosity=2).run(suite); raise SystemExit(not result.wasSuccessful())"
      - name: Full regression with actual Tk (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -c "import faulthandler,unittest; faulthandler.dump_traceback_later(120, exit=True); suite=unittest.defaultTestLoader.discover('tests'); result=unittest.TextTestRunner(verbosity=2).run(suite); raise SystemExit(not result.wasSuccessful())"
      - name: Small real PDF smoke (up to 7 pages, serial and process)
        run: python scripts/verify_smoke.py
      - name: Tiny CPU RAM lab (two pages, three repeats)
        run: python scripts/verify_lab_smoke.py
      - name: Small PDF optimization comparison (seven pages, three repeats)
        run: python scripts/verify_pdf_optimization.py
      - name: Preserve measured PDF verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ runner.os }}-evidence
          path: output/smoke
      - name: Preserve CPU RAM lab evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resource-lab-${{ runner.os }}-evidence
          path: output/lab-smoke
      - name: Preserve PDF optimization evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-optimization-${{ runner.os }}-evidence
          path: output/optimization-smoke
